# Production-path reference stack: Apache Kafka (KRaft, no ZooKeeper) + Apache Spark.
# NOTE: provided as the scale-out path described in the README. It was NOT executed in the
# development environment (no Docker/Java available); the runnable prototype is the Python
# implementation in ../src, which mirrors the same architecture.
#
#   docker compose up -d
#   python scale_out/kafka_bridge.py          # replay the local event log into Kafka
#   docker compose exec spark-master /opt/spark/bin/spark-submit \
#       --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 /jobs/spark_streaming_job.py
services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 8

  spark-master:
    image: apache/spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8080:8080", "7077:7077"]
    volumes:
      - ./:/jobs
      - ../data:/data

  spark-worker:
    image: apache/spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    deploy:
      replicas: 2          # scale horizontally: docker compose up --scale spark-worker=4
    volumes:
      - ./:/jobs
      - ../data:/data
