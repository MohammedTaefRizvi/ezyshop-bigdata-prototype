[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ezyshop-bigdata-prototype"
version = "1.0.0"
description = "EzyShop Big Data lakehouse prototype (DAT801A Assessment 3)"
requires-python = ">=3.11"
dependencies = [
    "pandas", "numpy", "pyarrow", "duckdb", "scikit-learn",
    "streamlit", "plotly", "matplotlib", "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
